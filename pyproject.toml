[project]
name = "backtrader-trading"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.12"
dependencies = [
    "backtrader>=1.9.78.122",
    "pandas>=2.3.2",
    "akshare>=1.17.44",
    "tushare>=1.2.89",
    "sqlmodel>=0.0.14",
    "python-dotenv>=1.0.0",
    "tqdm>=4.67.1",
    "matplotlib>=3.8.0",
    "scipy>=1.17.0",
]

[dependency-groups]
dev = [
    "mypy==1.11.0",
    "pre-commit==4.2.0",
    "ruff==0.5.5",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["grammars", ".git", "__pycache__", "*.egg-info", ".venv", "venv"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
